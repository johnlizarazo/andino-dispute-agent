[project]
name = "andino-dispute-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chainlit>=2.12.0",
    "claude-agent-sdk>=0.2.168",
    "mcp[cli]>=1.30.0",
]

[project.scripts]
andino-dispute-agent = "andino_dispute_agent:main"

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
