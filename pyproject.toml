[project]
name = "andino-dispute-agent"
version = "0.1.0"
description = "AI agent for first-contact transaction disputes at Banco Andino (fictional), built with Claude Agent SDK and a mock core-banking MCP server."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chainlit>=2.12.0",
    "claude-agent-sdk>=0.2.168",
    "mcp[cli]>=1.30.0",
]

[project.scripts]
andino-chat = "agente_disputas.interfaz:main"

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["agente_disputas", "core_bancario_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["src", "tests", "plugins"]
markers = [
    "e2e: escenarios de punta a punta que llaman al modelo (requieren ANTHROPIC_API_KEY)",
]
addopts = "-m 'not e2e'"
